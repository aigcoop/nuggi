<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 배경 제거 (누끼따기)</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- @imgly/background-removal library -->
    <script src="https://unpkg.com/@imgly/background-removal@1.4.3/dist/imgly-background-removal.umd.js"></script>
    
    <style>
        /* 투명한 배경을 잘 보여주기 위한 체크무늬 패턴 */
        .checkerboard {
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        .drag-active {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans selection:bg-blue-200">

    <div class="max-w-5xl mx-auto px-4 py-12">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-3 tracking-tight">AI 배경 제거기</h1>
            <p class="text-lg text-gray-600">이미지를 업로드하면 AI가 자동으로 배경을 지워 투명하게 만들어 줍니다.<br><span class="text-sm text-gray-500">(모든 처리는 브라우저 내부에서 진행되어 안전합니다)</span></p>
        </div>

        <!-- Main Content Area -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-gray-100">
            
            <!-- Upload Zone -->
            <div id="uploadZone" class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center cursor-pointer hover:bg-gray-50 transition-colors duration-200 ease-in-out relative flex flex-col items-center justify-center min-h-[300px]">
                <input type="file" id="fileInput" class="hidden" accept="image/jpeg, image/png, image/webp">
                
                <svg class="w-16 h-16 text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <h3 class="text-xl font-semibold text-gray-700 mb-2">클릭하거나 이미지를 이곳으로 드래그하세요</h3>
                <p class="text-gray-500">지원 형식: JPG, PNG, WEBP</p>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="hidden flex-col items-center justify-center py-16">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-6"></div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">배경을 제거하는 중입니다...</h3>
                <p id="progressText" class="text-gray-600 text-center max-w-md">
                    최초 실행 시 AI 모델을 다운로드하므로 약간의 시간이 소요될 수 있습니다. (약 30~50MB)
                </p>
                <!-- Progress Bar Container -->
                <div class="w-full max-w-md bg-gray-200 rounded-full h-2.5 mt-4 overflow-hidden">
                    <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>

            <!-- Error State -->
            <div id="errorState" class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 flex items-start">
                <svg class="w-6 h-6 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                    <h4 class="font-bold">오류가 발생했습니다</h4>
                    <p id="errorMessage" class="text-sm mt-1"></p>
                </div>
            </div>

            <!-- Preview / Result Zone -->
            <div id="resultZone" class="hidden mt-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">결과 확인</h3>
                    <button id="newUploadBtn" class="px-4 py-2 text-sm font-medium text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 transition">
                        다른 이미지 업로드
                    </button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Original Image -->
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-gray-500 mb-2 uppercase tracking-wider">원본 이미지</span>
                        <div class="border rounded-lg overflow-hidden bg-gray-100 flex-grow flex items-center justify-center min-h-[300px]">
                            <img id="originalImg" class="max-w-full max-h-[400px] object-contain" src="" alt="원본">
                        </div>
                    </div>
                    
                    <!-- Processed Image -->
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-green-600 mb-2 uppercase tracking-wider flex justify-between items-center">
                            <span>배경 제거됨 (투명)</span>
                        </span>
                        <div class="border rounded-lg overflow-hidden checkerboard flex-grow flex items-center justify-center min-h-[300px]">
                            <img id="resultImg" class="max-w-full max-h-[400px] object-contain drop-shadow-md" src="" alt="결과">
                        </div>
                    </div>
                </div>

                <!-- Download Action -->
                <div class="mt-8 flex justify-center">
                    <button id="downloadBtn" class="flex items-center px-8 py-4 bg-blue-600 text-white text-lg font-bold rounded-full hover:bg-blue-700 hover:shadow-lg transform transition active:scale-95">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        투명 이미지 다운로드 (.PNG)
                    </button>
                </div>
            </div>
            
        </div>
        
        <div class="text-center mt-12 text-gray-500 text-sm">
            <p>Powered by <a href="https://github.com/imgly/background-removal-js" target="_blank" class="text-blue-500 hover:underline">@imgly/background-removal</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const loadingState = document.getElementById('loadingState');
            const resultZone = document.getElementById('resultZone');
            const errorState = document.getElementById('errorState');
            const errorMessage = document.getElementById('errorMessage');
            const originalImg = document.getElementById('originalImg');
            const resultImg = document.getElementById('resultImg');
            const downloadBtn = document.getElementById('downloadBtn');
            const newUploadBtn = document.getElementById('newUploadBtn');
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');

            let currentProcessedObjectURL = null;
            let currentOriginalObjectURL = null;

            // --- Event Listeners for Drag and Drop ---
            uploadZone.addEventListener('click', () => fileInput.click());

            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadZone.classList.add('drag-active');
            });

            uploadZone.addEventListener('dragleave', () => {
                uploadZone.classList.remove('drag-active');
            });

            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('drag-active');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            newUploadBtn.addEventListener('click', () => {
                resetUI();
            });

            // --- Core Logic ---
            function resetUI() {
                uploadZone.classList.remove('hidden');
                resultZone.classList.add('hidden');
                errorState.classList.add('hidden');
                loadingState.classList.add('hidden');
                fileInput.value = ''; // Reset input
                
                // Cleanup Object URLs to free memory
                if (currentProcessedObjectURL) URL.revokeObjectURL(currentProcessedObjectURL);
                if (currentOriginalObjectURL) URL.revokeObjectURL(currentOriginalObjectURL);
            }

            async function handleFile(file) {
                // Validate file type
                if (!file.type.startsWith('image/')) {
                    showError('올바른 이미지 파일을 업로드해주세요. (JPG, PNG 등)');
                    return;
                }

                // UI Transitions
                uploadZone.classList.add('hidden');
                errorState.classList.add('hidden');
                resultZone.classList.add('hidden');
                loadingState.classList.remove('hidden');
                
                progressBar.style.width = '0%';
                progressText.textContent = 'AI 모델을 준비 중입니다...';

                try {
                    // Set Original Image Preview
                    currentOriginalObjectURL = URL.createObjectURL(file);
                    originalImg.src = currentOriginalObjectURL;

                    // Configuration for @imgly/background-removal
                    const config = {
                        publicPath: 'https://unpkg.com/@imgly/background-removal@1.4.3/dist/', // WASM 및 ONNX 모델 경로
                        progress: (key, current, total) => {
                            if (total) {
                                const percent = Math.round((current / total) * 100);
                                progressBar.style.width = `${percent}%`;
                                
                                if (key.includes('fetch')) {
                                    progressText.textContent = `AI 모델 다운로드 중... (${percent}%)`;
                                } else if (key.includes('compute')) {
                                    progressText.textContent = `이미지 분석 및 배경 제거 중... (${percent}%)`;
                                } else {
                                    progressText.textContent = `처리 중... (${percent}%)`;
                                }
                            }
                        }
                    };

                    // Run the AI Background Removal (this function is provided by the UMD script)
                    const imageBlob = await imglyRemoveBackground(file, config);

                    // Create URL for the result and set it
                    currentProcessedObjectURL = URL.createObjectURL(imageBlob);
                    resultImg.src = currentProcessedObjectURL;

                    // Setup Download Button
                    downloadBtn.onclick = () => {
                        const originalName = file.name.replace(/\.[^/.]+$/, ""); // 확장자 제거
                        const a = document.createElement('a');
                        a.href = currentProcessedObjectURL;
                        a.download = `${originalName}_nukki.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    };

                    // Show Results
                    loadingState.classList.add('hidden');
                    resultZone.classList.remove('hidden');

                } catch (error) {
                    console.error("Background removal error:", error);
                    loadingState.classList.add('hidden');
                    uploadZone.classList.remove('hidden');
                    showError(`이미지 처리 중 문제가 발생했습니다: ${error.message || '알 수 없는 오류'}`);
                }
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorState.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
